<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="A rainy day discount sign at a shop">
  <rect width="800" height="300" fill="#dce6ee"/>
  <rect x="0" y="244" width="800" height="56" fill="#c8d6e0"/>
  <!-- 雨 -->
  <g stroke="#9db8cc" stroke-width="3" stroke-linecap="round">
