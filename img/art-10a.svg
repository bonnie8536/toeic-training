    <line x1="240" y1="30" x2="226" y2="70"/><line x1="600" y1="16" x2="586" y2="56"/>
    <line x1="680" y1="34" x2="666" y2="74"/><line x1="750" y1="12" x2="736" y2="52"/>
    <line x1="120" y1="90" x2="106" y2="130"/><line x1="700" y1="100" x2="686" y2="140"/>
