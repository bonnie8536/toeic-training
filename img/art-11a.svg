  <path d="M180 150 L180 88 A62 62 0 0 1 234 180 Z" fill="#e9f4fc"/>
  <line x1="180" y1="150" x2="180" y2="92" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="150" x2="228" y2="176" stroke="#0b72c4" stroke-width="6" stroke-linecap="round"/>
  <circle cx="180" cy="150" r="7" fill="#404040"/>
  <!-- 耳機客服 -->
  <circle cx="440" cy="128" r="26" fill="#fff" stroke="#404040" stroke-width="4"/>
  <path d="M412 126 a28 28 0 0 1 56 0" fill="none" stroke="#0b72c4" stroke-width="6"/>
  <rect x="404" y="122" width="14" height="22" rx="6" fill="#0b72c4"/>
