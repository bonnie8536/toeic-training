  <path d="M560 78 h180 a10 10 0 0 1 10 10 v56 a10 10 0 0 1 -10 10 h-140 l-26 22 v-22 h-14 a10 10 0 0 1 -10 -10 v-56 a10 10 0 0 1 10 -10z" fill="#0b72c4"/>
  <rect x="580" y="100" width="120" height="9" rx="4" fill="#fff"/>
  <rect x="580" y="118" width="86" height="9" rx="4" fill="#9fd0f5"/>
