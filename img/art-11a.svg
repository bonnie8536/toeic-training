  <circle cx="690" cy="200" r="34" fill="#e8f4ea" stroke="#3a8a4d" stroke-width="4"/>
  <path d="M672 200 l12 14 l24 -28" fill="none" stroke="#3a8a4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
