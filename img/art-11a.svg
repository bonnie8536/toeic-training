<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Customer service replying within one hour">
  <rect width="800" height="300" fill="#eef3f7"/>
  <rect x="0" y="246" width="800" height="54" fill="#dde7ee"/>
  <!-- 大時鐘:一小時 -->
