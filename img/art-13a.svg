<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Comparing supplier quotes and hidden costs">
  <rect width="800" height="300" fill="#eef3f7"/>
  <!-- 兩張報價單 -->
  <rect x="90" y="60" width="200" height="180" rx="8" fill="#fff" stroke="#404040" stroke-width="4"/>
  <rect x="114" y="86" width="100" height="12" rx="6" fill="#0b72c4"/>
  <rect x="114" y="112" width="150" height="8" rx="4" fill="#dde7ee"/>
  <rect x="114" y="130" width="130" height="8" rx="4" fill="#dde7ee"/>
  <rect x="114" y="168" width="86" height="20" rx="6" fill="#3a8a4d"/>
  <text x="204" y="216" font-family="Arial" font-size="15" fill="#767f88" text-anchor="middle">low price</text>
  <rect x="440" y="60" width="200" height="180" rx="8" fill="#fff" stroke="#404040" stroke-width="4"/>
  <rect x="464" y="86" width="100" height="12" rx="6" fill="#0b72c4"/>
  <rect x="464" y="112" width="150" height="8" rx="4" fill="#dde7ee"/>
  <rect x="464" y="130" width="130" height="8" rx="4" fill="#dde7ee"/>
  <rect x="464" y="168" width="118" height="20" rx="6" fill="#9db8cc"/>
  <!-- 隱藏成本(冰山) -->
  <path d="M300 250 h420" stroke="#0b72c4" stroke-width="4" stroke-dasharray="12 8"/>
  <path d="M150 250 l60 -30 l60 30 z" fill="#9fd0f5"/>
  <path d="M110 250 h200 l-40 44 h-120 z" fill="#0b72c4" opacity=".55"/>
  <!-- 天秤傾斜 -->
  <line x1="700" y1="120" x2="700" y2="250" stroke="#404040" stroke-width="6"/>
  <line x1="648" y1="140" x2="752" y2="112" stroke="#404040" stroke-width="6"/>
  <circle cx="648" cy="140" r="9" fill="#c94040"/>
  <circle cx="752" cy="112" r="9" fill="#3a8a4d"/>
</svg>
