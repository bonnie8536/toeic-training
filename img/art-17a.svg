  <line x1="400" y1="176" x2="460" y2="176" stroke="#9db8cc" stroke-width="5" stroke-linecap="round"/>
  <line x1="420" y1="202" x2="466" y2="202" stroke="#9db8cc" stroke-width="5" stroke-linecap="round"/>
</svg>
