  <rect x="90" y="90" width="220" height="152" fill="#fff" stroke="#404040" stroke-width="4"/>
  <path d="M74 90 h252 l-18 -30 h-216 z" fill="#c94040"/>
  <rect x="120" y="130" width="80" height="70" rx="4" fill="#9fd0f5"/>
  <rect x="230" y="130" width="56" height="112" fill="#095d9f"/>
  <circle cx="240" cy="190" r="5" fill="#ffd964"/>
