  <rect x="424" y="150" width="120" height="54" rx="6" fill="#0b72c4" transform="rotate(4 484 177)"/>
  <rect x="272" y="166" width="88" height="8" rx="4" fill="#fff" transform="rotate(-4 316 170)"/>
