<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* 搬家收件頁(新網址用,搬家計畫 2.3)。不能被別的網站框住誘按:被框住就什麼都不顯示 */
if (window.top !== window.self) { document.documentElement.style.display = 'none'; }
(function () {
  var sa = false;
  try { sa = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { sa = false; }
  if (sa) document.documentElement.classList.add('is-app');
})();
</script>

.move-done { color: var(--ok); font-weight: 700; font-size: 16px; }
#move-root .modal-row { flex-wrap: wrap; }
</style>
</head>
