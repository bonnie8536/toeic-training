<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="把全站題庫整理成可下載的完整套卷與詳解。上架中,留下 Email 第一時間收到通知。">
<link rel="canonical" href="https://bonnie8536.github.io/toeic-training/packs.html">
<meta property="og:type" content="website">
<meta property="og:title" content="衝刺包|刷刷英文">
<meta property="og:description" content="把全站題庫整理成可下載的完整套卷與詳解。上架中,留下 Email 第一時間收到通知。">

<title>衝刺包|刷刷英文</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
.notify-form { display: flex; gap: 8px; max-width: 460px; margin-top: 14px; }
.notify-form input {
  flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px;
  font-size: 15px; min-width: 0;
}
.notify-form button {
  padding: 10px 18px; border: 0; border-radius: 6px; background: var(--primary);
  color: #fff; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.notify-status { margin-top: 10px; font-size: 14px; }
.notify-status.ok { color: #2e7d32; }
.notify-status.err { color: #c62828; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-mark">刷刷</span>英文</a>
    <nav class="topnav">
      <a href="index.html">首頁</a>
      <a href="diagnostic.html">程度檢測</a>
      <a href="listening.html">聽力訓練</a>
      <a href="reading.html">閱讀訓練</a>
      <a href="practice.html">題庫刷題</a>
      <a href="writing.html">寫作練習</a>
      <a href="packs.html" class="active">衝刺包</a>
    </nav>
  </div>
</header>

<main class="container-narrow" style="padding-top: 28px;">
  <h1>衝刺包</h1>
  <p>網站上的題庫是零散練的。衝刺包把它們整理成可下載的完整套卷:閱讀 Part 5/6/7 成套計時卷、逐題詳解、聽力音檔與逐字稿,照考前四週的順序排好。</p>
  <p>正在上架。留下 Email,開賣時通知你,並先寄一份考前重點整理。</p>

  <form class="notify-form" id="notify-form">
    <input type="email" id="notify-email" placeholder="你的 Email" autocomplete="email" required>
    <button type="submit">通知我</button>
  </form>
  <p class="notify-status" id="notify-status"></p>
</main>

<footer>
  <div class="container-narrow">刷刷英文——個人建置的免費英文練習資源。本站與 ETS 及忠欣公司無關;TOEIC 為 ETS 之註冊商標。</div>
</footer>

<script src="js/cloud-config.js"></script>
<script src="js/common.js"></script>
<script src="js/cloud.js"></script>
<script src="js/profile.js"></script>
<script>
(function () {
  const form = document.getElementById('notify-form');
  const input = document.getElementById('notify-email');
  const status = document.getElementById('notify-status');

  function show(msg, ok) {
    status.textContent = msg;
    status.className = 'notify-status ' + (ok ? 'ok' : 'err');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = input.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { show('Email 格式不對,再檢查一下。', false); return; }
    if (!window.CLOUD || !CLOUD.enabled) { show('目前無法登記,請直接寫信到 bonnie8536@gmail.com。', false); return; }
    try {
      await CLOUD.ready;
      const { error } = await CLOUD.client.from('email_signups').insert({ email: email, source: 'packs' });
      if (error) {
        if (error.code === '23505') { show('這個 Email 已經登記過了,上架時會通知你。', true); input.value = ''; return; }
        throw error;
      }
      show('已登記,上架時會第一時間通知你。', true);
      input.value = '';
    } catch (err) {
      show('連線失敗,請稍後再試,或直接寫信到 bonnie8536@gmail.com。', false);
    }
  });
})();
</script>
</body>
</html>
