<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>重設密碼|刷刷英文</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<script>
/* 從重設密碼信點進來時網址帶 type=recovery;先記下來,雲端層初始化可能會重新整理頁面 */
if (/type=recovery/.test(location.hash)) sessionStorage.setItem('tr_pw_recovery', '1');
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">刷刷英文</a>
  </div>
</header>

<main class="container-narrow">
  <div id="reset-root" class="q-block" style="max-width:460px;margin:40px auto">
    <h1 style="font-size:22px;margin:0 0 6px">重設密碼</h1>
    <p class="result-note">正在確認連結…</p>
  </div>
</main>

<script src="js/cloud-config.js"></script>
<script src="js/common.js"></script>
<script src="js/cloud.js"></script>
<script>
(async function () {
  const root = document.getElementById('reset-root');
  const draw = (...nodes) => { root.innerHTML = ''; root.append(h('h1', { style: 'font-size:22px;margin:0 0 6px' }, '重設密碼'), ...nodes); };
  if (!window.CLOUD || !CLOUD.enabled) { draw(h('p', { class: 'result-note' }, '此站未啟用雲端帳號。')); return; }
  await CLOUD.ready;
  const recovering = sessionStorage.getItem('tr_pw_recovery') === '1' && CLOUD.user;

  if (!recovering) {
    /* 連結失效或直接打開此頁:讓使用者重新申請 */
    const email = h('input', { class: 'modal-input', type: 'email', placeholder: 'Email', autocomplete: 'email' });
    const msg = h('div', { class: 'result-note', style: 'margin-top:10px' });
    const btn = h('button', { class: 'btn primary', type: 'button', onclick: async () => {
      msg.textContent = ''; btn.disabled = true;
      try { await CLOUD.resetPassword(email.value); msg.textContent = '重設信已寄出,請到信箱點連結(幾分鐘內沒收到可看垃圾郵件)。'; }
      catch (e) { msg.textContent = e.message; btn.disabled = false; }
    } }, '寄重設信');
    draw(h('p', { class: 'result-note' }, CLOUD.user ? '這個重設連結已失效或已用過。' : '輸入註冊的 Email,我們會寄一封重設密碼的信給你。'),
      h('div', { class: 'modal-row' }, email, btn), msg,
      h('p', { style: 'margin-top:18px' }, h('a', { href: 'index.html' }, '回首頁')));
    return;
  }

  const pw = h('input', { class: 'modal-input', type: 'password', placeholder: '新密碼(至少 8 碼)', autocomplete: 'new-password' });
  const pw2 = h('input', { class: 'modal-input', type: 'password', placeholder: '再輸入一次', autocomplete: 'new-password' });
  const msg = h('div', { style: 'color:var(--bad);font-size:13.5px;margin-top:8px;min-height:20px' });
  const btn = h('button', { class: 'btn primary', type: 'button', onclick: async () => {
    msg.textContent = '';
    if (pw.value.length < 8) { msg.textContent = '密碼至少 8 碼。'; return; }
    if (pw.value !== pw2.value) { msg.textContent = '兩次輸入的密碼不一樣。'; return; }
    btn.disabled = true;
    try {
      await CLOUD.updatePassword(pw.value);
      sessionStorage.removeItem('tr_pw_recovery');
      draw(h('p', { class: 'result-note' }, '密碼已更新,你已經是登入狀態。'),
        h('a', { class: 'btn primary', href: 'index.html' }, '回首頁開始練習'));
    } catch (e) { msg.textContent = e.message; btn.disabled = false; }
  } }, '更新密碼');
  draw(h('p', { class: 'result-note' }, '帳號:' + (CLOUD.user.email || '')),
    h('div', { style: 'display:grid;gap:8px' }, pw, pw2), msg,
    h('div', { class: 'modal-row', style: 'margin-top:6px' }, btn));
})();
</script>
</body>
</html>
